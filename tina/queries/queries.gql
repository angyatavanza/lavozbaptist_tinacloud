query pageQuery {
  ...LayoutQueryFragment
  messageConnection {
    edges {
      node {
        id
        date
        title
        excerpt
        author {
          ... on Author {
            ...AuthorParts
          }
        }
        _sys {
          filename
        }
      }
    }
  }
}

query contentQuery($relativePath: String!) {
  ...LayoutQueryFragment
  page(relativePath: $relativePath) {
    ...PageParts
  }
}

query blogMessageQuery($relativePath: String!) {
  ...LayoutQueryFragment
  message(relativePath: $relativePath) {
    ...MessageParts
    author {
      ... on Author {
        name
        avatar
      }
    }
  }
}
